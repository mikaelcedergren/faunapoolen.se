<fp-site-shell>
  <cx-hero
    [underMasthead]="true"
    headingClass="cx-font-regular"
    [heading]="copy.home.title"
    variant="cover"
    align="center"
    [fadeBottom]="true"
  >
    <p body>{{ copy.home.ingress }}</p>
    <cx-button
      actions
      [text]="copy.home.primary"
      mood="primary"
      size="large"
      [href]="configureHref"
    />
    <cx-button
      actions
      [text]="copy.home.secondary"
      size="large"
      [href]="routeFor('gotland')"
      appendIcon="arrow-right"
    />
    <p meta>{{ editorial.firstContact }}</p>
    <img
      media
      [src]="images.hero"
      [alt]="editorial.heroAlt"
      width="1536"
      height="1024"
      fetchpriority="high"
    />
  </cx-hero>

  <section class="cx-container cx-py-2xl" aria-labelledby="home-case-title">
    <cx-card>
      <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
        <a [href]="routeFor('gotland')" [attr.aria-label]="evidence.caseLink">
          <cx-image
            class="cx-w-full"
            [image]="{
              src: projectPhoto.src,
              alt: projectPhoto.alt,
              loading: 'lazy',
              intrinsicWidth: 1920,
              intrinsicHeight: 1440,
              borderRadius: 'large',
            }"
          />
        </a>
        <cx-stack gap="xl" align="start">
          <div class="cx-editorial">
            <h2 id="home-case-title" class="cx-font-regular">{{ evidence.caseTitle }}</h2>
          </div>
          <fp-customer-quote [review]="testimonials[1]" />
          <cx-button
            [text]="evidence.caseLink"
            [href]="routeFor('gotland')"
            appendIcon="arrow-right"
            size="large"
          />
        </cx-stack>
      </cx-grid>
    </cx-card>
  </section>

  <section class="cx-container cx-py-2xl" aria-labelledby="home-life-title">
    <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
      <div class="cx-editorial">
        <h2 id="home-life-title" class="cx-font-regular">{{ editorial.lifeTitle }}</h2>
        <p>{{ editorial.lifeBody }}</p>
        <p>
          <a [href]="routeFor('nature-pools')">{{ editorial.lifeLink }} →</a>
        </p>
      </div>
      <cx-image
        class="cx-w-full"
        [image]="{
          src: images.architecture,
          alt: editorial.architectureAlt,
          loading: 'lazy',
          intrinsicWidth: 1536,
          intrinsicHeight: 1024,
          borderRadius: 'large',
        }"
      />
    </cx-grid>
  </section>

  <div class="cx-bg-surface-alt">
    <div class="cx-container cx-py-2xl">
      <fp-package-comparison />
    </div>
  </div>

  <section class="cx-container cx-py-2xl" aria-labelledby="home-waterscape-title">
    <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
      <cx-image
        class="cx-w-full"
        [image]="{
          src: images.waterscape,
          alt: editorial.waterscapeAlt,
          loading: 'lazy',
          intrinsicWidth: 1536,
          intrinsicHeight: 1024,
          borderRadius: 'large',
        }"
      />
      <div class="cx-editorial">
        <h2 id="home-waterscape-title" class="cx-font-regular">{{ copy.home.waterscapeTitle }}</h2>
        <p>{{ copy.home.waterscapeBody }}</p>
        <p>
          <a [href]="routeFor('waterscapes')">{{ copy.nav.waterscapes }} →</a>
        </p>
      </div>
    </cx-grid>
  </section>
  <div class="cx-container cx-py-2xl">
    <fp-process />
  </div>
  <div class="cx-container cx-py-2xl">
    <fp-service-area />
  </div>
</fp-site-shell>
