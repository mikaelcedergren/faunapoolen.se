<section id="aquascape" aria-labelledby="aquascape-title" class="cx-scroll-target">
  <cx-card>
    <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" gapMobile="lg" [align]="'center'">
      <div class="cx-editorial">
        <h2 id="aquascape-title" class="fp-heading cx-font-regular">
          {{ evidence.technologyTitle }}
        </h2>
        <p>{{ evidence.technologyBody }}</p>
        @if (page === 'home') {
          <p>
            <a [href]="routeFor('nature-pools') + '#aquascape'"
              >{{ editorial.technologyDetails }} →</a
            >
          </p>
        } @else {
          <p>
            <a [href]="guideHref('how-filtering-works-with-nature-pools')"
              >{{ evidence.technologyLink }} →</a
            >
          </p>
        }
      </div>
      <cx-stack gap="md" align="start">
        <cx-image
          class="cx-w-full"
          [image]="{
            src: aquascapeImages.recreationalPond,
            alt: editorial.supplierAlt,
            loading: 'lazy',
            intrinsicWidth: 1200,
            borderRadius: 'large',
          }"
        />
        <p class="cx-editorial cx-text-muted">
          {{ evidence.videoCaption }}
        </p>
      </cx-stack>
    </cx-grid>
  </cx-card>
</section>
