<fp-site-shell>
  <cx-hero
    [underMasthead]="false"
    headingClass="cx-font-regular"
    [heading]="copy.about.title"
    variant="stacked"
  >
    <p body>{{ copy.about.ingress }}</p>
  </cx-hero>
  <div class="cx-container fp-section">
    <section id="certification" class="cx-scroll-target" aria-labelledby="about-method-title">
      <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl">
        <div class="cx-editorial">
          <h2 id="about-method-title" class="fp-heading cx-font-regular">
            {{ copy.about.methodTitle }}
          </h2>
          <p>{{ copy.about.methodBody }}</p>
        </div>
        <div>
          <cx-stack gap="md">
            <fp-certification />
            <p class="cx-text-body-lg cx-text-muted">
              {{ evidence.certificationDetail }}
            </p>
            <cx-button
              [text]="evidence.certificationLink"
              [href]="aquascape.certification"
              appendIcon="open-new"
            />
          </cx-stack>
        </div>
      </cx-grid>
    </section>
  </div>
  <div class="cx-container fp-section">
    <section aria-labelledby="about-proof-title">
      <div>
        <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" align="center">
          <a [href]="routeFor('gotland')" [attr.aria-label]="evidence.caseLink">
            <cx-image
              class="cx-w-full"
              [image]="{
                src: projectPhoto.src,
                alt: projectPhoto.alt,
                loading: 'lazy',
                intrinsicWidth: 1920,
                intrinsicHeight: 1440,
                borderRadius: 'large',
              }"
            />
          </a>
          <cx-stack gap="xl" align="start">
            <div class="cx-editorial">
              <h2 id="about-proof-title" class="fp-heading cx-font-regular">
                {{ evidence.caseTitle }}
              </h2>
            </div>
            <fp-customer-quote [review]="testimonials[0]" />
            <cx-button
              [text]="evidence.caseLink"
              [href]="routeFor('gotland')"
              appendIcon="arrow-right"
            />
          </cx-stack>
        </cx-grid>
      </div>
    </section>
  </div>
  <div class="cx-container fp-section">
    <section class="cx-editorial">
      <p>
        <a [href]="routeFor('nature-pools')">{{ commercial.poolLink }} →</a>
      </p>
      <p>
        <a [href]="routeFor('pricing')">{{ commercial.packageLink }} →</a>
      </p>
    </section>
  </div>
  <div class="cx-container fp-section">
    <fp-service-area />
  </div>
</fp-site-shell>
