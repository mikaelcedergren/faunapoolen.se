<fp-site-shell>
  <div hero class="fp-intro">
    <cx-hero
      [underMasthead]="true"
      headingClass="cx-font-regular"
      [heading]="copy.projects.title"
      variant="stacked"
    >
      <p body>{{ copy.projects.ingress }}</p>
      <cx-button
        actions
        [text]="evidence.caseLink"
        [href]="routeFor('gotland')"
        appendIcon="arrow-right"
        mood="primary"
        size="large"
      />
      <a
        media
        class="fp-project-link"
        [href]="routeFor('gotland')"
        [attr.aria-label]="evidence.caseLink"
      >
        <img
          class="fp-photo"
          [src]="projectPhoto.src"
          [alt]="projectPhoto.alt"
          width="1920"
          height="1440"
          fetchpriority="high"
        />
      </a>
    </cx-hero>
  </div>
  <section class="fp-section" [attr.aria-label]="evidence.caseTitle">
    <fp-customer-quote [review]="testimonials[0]" />
  </section>
</fp-site-shell>
