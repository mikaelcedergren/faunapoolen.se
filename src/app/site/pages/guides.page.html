<fp-site-shell>
  <div hero class="cx-measure-xl">
    <cx-hero
      [underMasthead]="true"
      headingClass="cx-font-regular"
      [heading]="copy.guides.title"
      variant="stacked"
    >
      <p body>{{ copy.guides.ingress }}</p>
    </cx-hero>
  </div>
  @for (group of groups; track group.title) {
    <div class="cx-container cx-py-2xl">
      <section [attr.aria-label]="group.title">
        <cx-stack gap="xl">
          <div class="cx-editorial">
            <h2 class="cx-font-regular">{{ group.title }}</h2>
          </div>
          <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" gapMobile="xl">
            @for (item of group.articles; track item.id) {
              <cx-card variant="border" [href]="guideHref(item.id)" [ariaLabel]="item.title">
                <cx-stack gap="lg">
                  <cx-image
                    [image]="{
                      src: item.image,
                      alt: item.title,
                      height: '320',
                      objectFit: 'cover',
                      borderRadius: 'large',
                    }"
                  />
                  <cx-stack gap="sm">
                    <h3 class="cx-text-title-1 cx-font-serif cx-font-regular">
                      {{ item.title }}
                    </h3>
                    <p class="cx-text-body-lg cx-text-muted">{{ item.seo.description }}</p>
                    <span class="cx-text-link">{{ copy.guides.read }} →</span>
                  </cx-stack>
                </cx-stack>
              </cx-card>
            }
          </cx-grid>
        </cx-stack>
      </section>
    </div>
  }
  <div class="cx-container cx-py-2xl">
    <p class="cx-text-body-lg">
      <a [href]="routeFor('pricing')">{{ pricingLink }} →</a>
    </p>
  </div>
</fp-site-shell>
