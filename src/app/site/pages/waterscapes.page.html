<fp-site-shell>
  <div hero class="fp-intro">
    <cx-hero
      [underMasthead]="true"
      headingClass="cx-font-regular"
      [heading]="copy.waterscapes.title"
      variant="split"
    >
      <p body>{{ copy.waterscapes.ingress }}</p>
      <cx-button
        actions
        [text]="copy.start"
        mood="primary"
        size="large"
        [href]="configureHref + '?service=pond'"
      />
      <img
        class="fp-photo"
        media
        [src]="images.waterscape"
        [alt]="editorial.waterscapeAlt"
        width="1536"
        height="1024"
        fetchpriority="high"
      />
    </cx-hero>
  </div>
  <div class="fp-section">
    <cx-stack gap="2xl">
      <section aria-labelledby="water-types-title">
        <cx-stack gap="xl">
          <div class="cx-editorial">
            <h2 id="water-types-title" class="cx-font-regular">
              {{ copy.waterscapes.typesTitle }}
            </h2>
          </div>
          <cx-grid [columns]="3" [columnsMobile]="1" gap="lg">
            @for (item of copy.waterscapes.types; track item.title; let i = $index) {
              <cx-stack gap="md">
                <h3 class="cx-text-title-2 cx-font-serif cx-font-regular">
                  {{ item.title }}
                </h3>
                <p class="cx-text-body-lg cx-text-muted">{{ item.body }}</p>
                <cx-button
                  [text]="editorial.discussService"
                  [href]="configureHref + '?service=' + (i === 1 ? 'stream' : 'pond')"
                  appendIcon="arrow-right"
                />
              </cx-stack>
            }
          </cx-grid>
        </cx-stack>
      </section>

      <section aria-labelledby="waterscape-method-title">
        <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
          <cx-stack gap="sm"
            ><img
              class="fp-photo"
              [src]="images.detail"
              [alt]="ui.water_ripples_wet_stone_and_reeds_in_close_detail"
              width="1536"
              loading="lazy"
          /></cx-stack>
          <cx-stack gap="lg">
            <div class="cx-editorial">
              <h2 id="waterscape-method-title" class="cx-font-regular">
                {{ copy.waterscapes.methodTitle }}
              </h2>
            </div>
            <div class="cx-editorial">
              <p>{{ copy.waterscapes.methodBody }}</p>
            </div>
          </cx-stack>
        </cx-grid>
      </section>
    </cx-stack>
  </div></fp-site-shell
>
