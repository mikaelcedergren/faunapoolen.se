<div class="cx-page">
  <cx-masthead
    [items]="navItems"
    [menuAriaLabel]="copy.menuLabel"
    [frostOnScroll]="true"
    [overlay]="page !== 'guide'"
  >
    <a brand class="fp-brand cx-fill" [href]="homeHref" aria-label="Faunapoolen">
      <img class="fp-logo cx-p-xs" [src]="logo" alt="" width="40" height="40" />
      <span class="cx-truncate">Faunapoolen</span>
    </a>
    <cx-language-selector
      actions
      [languages]="languageOptions"
      [value]="locale"
      [translations]="{ ariaLabel: languageLabel }"
      (valueChange)="changeLanguage($event)"
    />
  </cx-masthead>
  <main>
    <ng-content select="cx-hero, [hero]" />
    @if (suggestion(); as language) {
      <div class="fp-section">
        <cx-alert
          [heading]="suggestionHeading"
          [action]="language"
          [dismissible]="true"
          (dismiss)="dismissSuggestion()"
        />
      </div>
    }
    <ng-content />
    @if (page !== 'configure' && page !== 'cookies') {
      <div class="fp-price-invitation">
        <section class="fp-section" aria-labelledby="contact-invitation-title">
          <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
            <div class="cx-editorial">
              <h2 id="contact-invitation-title" class="cx-font-regular">
                {{ copy.common.talkTitle }}
              </h2>
              <p>{{ priceInvitation }}</p>
            </div>
            <cx-inline>
              <cx-button
                [text]="pricesLabel"
                mood="primary"
                size="large"
                [href]="routeFor('pricing')"
                appendIcon="arrow-right"
              />
            </cx-inline>
          </cx-grid>
        </section>
      </div>
    }
  </main>
  <footer class="fp-band fp-footer" [attr.aria-label]="ui.footer">
    <div class="fp-section">
      <cx-grid [columns]="3" [columnsMobile]="1" gap="2xl">
        <cx-stack gap="lg" align="start">
          <a class="fp-brand" [href]="homeHref" aria-label="Faunapoolen">
            <img class="fp-logo" [src]="logo" alt="" width="64" height="64" />
          </a>
        </cx-stack>
        <nav [attr.aria-label]="copy.menuLabel">
          <cx-grid [columns]="2" [columnsMobile]="2" gap="lg">
            @for (item of navItems; track item.id) {
              <a [href]="item.href" [attr.aria-current]="item.active ? 'page' : null">{{
                item.label
              }}</a>
            }
          </cx-grid>
        </nav>
        <cx-stack gap="lg" align="start">
          <a href="mailto:info@faunapoolen.se">info&#64;faunapoolen.se</a>
          @if (measurement.available()) {
            <fp-cookie-notice [detailsHref]="routeFor('cookies')" />
          }
          <cx-language-selector
            [languages]="languageOptions"
            [value]="locale"
            [translations]="{ ariaLabel: languageLabel }"
            (valueChange)="changeLanguage($event)"
          />
        </cx-stack>
      </cx-grid>
    </div>
  </footer>
</div>
