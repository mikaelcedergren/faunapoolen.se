<fp-site-shell>
  <div hero class="fp-intro">
    <cx-hero
      [underMasthead]="true"
      headingClass="cx-font-regular"
      [heading]="copy.about.title"
      variant="stacked"
    >
      <p body>{{ copy.about.ingress }}</p>
    </cx-hero>
  </div>
  <div class="fp-section">
    <cx-stack gap="2xl">
      <section id="certification" class="fp-anchor" aria-labelledby="about-method-title">
        <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl">
          <cx-stack gap="lg">
            <div class="cx-editorial">
              <h2 id="about-method-title" class="cx-font-regular">{{ copy.about.methodTitle }}</h2>
            </div>
            <div class="cx-editorial">
              <p>{{ copy.about.methodBody }}</p>
            </div>
          </cx-stack>
          <cx-card>
            <cx-stack gap="md">
              <fp-certification />
              <p class="cx-text-body-lg cx-text-muted">
                {{ evidence.certificationDetail }}
              </p>
              <cx-button
                [text]="evidence.certificationLink"
                [href]="aquascape.certification"
                appendIcon="open-new"
              />
            </cx-stack>
          </cx-card>
        </cx-grid>
      </section>
      <section aria-labelledby="about-proof-title">
        <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" align="center">
          <a
            class="fp-project-link"
            [href]="routeFor('gotland')"
            [attr.aria-label]="evidence.caseLink"
          >
            <img
              class="fp-photo"
              [src]="projectPhoto.src"
              [alt]="projectPhoto.alt"
              width="1920"
              height="1440"
              loading="lazy"
            />
          </a>
          <cx-stack gap="xl" align="start">
            <h2 id="about-proof-title" class="cx-text-title-1 cx-font-serif cx-font-regular">
              {{ evidence.caseTitle }}
            </h2>
            <fp-customer-quote [review]="testimonials[0]" />
            <cx-button
              [text]="evidence.caseLink"
              [href]="routeFor('gotland')"
              appendIcon="arrow-right"
            />
          </cx-stack>
        </cx-grid>
      </section>
    </cx-stack></div
></fp-site-shell>
