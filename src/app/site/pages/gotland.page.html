<fp-site-shell>
  <cx-hero
    [heading]="evidence.caseTitle"
    headingClass="cx-font-regular"
    variant="cover"
    align="center"
    [underMasthead]="true"
    [overlayOpacity]="35"
  >
    <p body>{{ editorial.caseStory }}</p>
    <img
      media
      [src]="projectPhoto.src"
      [alt]="projectPhoto.alt"
      width="1920"
      height="1440"
      fetchpriority="high"
    />
  </cx-hero>
  <fp-certification-strip />
  @for (story of gotlandStories; track story.film.id) {
    <section
      class="cx-container fp-section fp-feature fp-feature--film"
      [class.fp-feature--reversed]="$odd"
      [attr.aria-labelledby]="'gotland-' + story.film.id"
    >
      <div class="cx-editorial">
        <h2 [id]="'gotland-' + story.film.id" class="fp-heading cx-font-regular">
          {{ story.heading }}
        </h2>
        <p>{{ story.body }}</p>
      </div>
      <fp-gotland-film [film]="story.film" [heading]="story.heading" />
    </section>
    @if (!$last) {
      <div class="cx-container"><cx-divider /></div>
    }
  }
  <div class="cx-container fp-section">
    <section [attr.aria-label]="evidence.caseTitle">
      <cx-masonry [columns]="3" [columnsMobile]="2" gap="lg">
        @for (item of gotlandPhotos; track item.id) {
          <a
            class="cx-figure"
            [attr.data-gotland-photo]="item.id"
            [href]="item.src"
            (click)="gallery.openPhoto($event, item.id)"
            [attr.aria-label]="gotlandCopy.enlarge + ': ' + item.alt"
          >
            <img
              class="cx-w-full cx-rounded-xl"
              [src]="item.preview"
              [attr.srcset]="
                item.preview + ' ' + item.width / 2 + 'w, ' + item.src + ' ' + item.width + 'w'
              "
              sizes="(max-width: 767px) 50vw, 400px"
              [alt]="item.alt"
              [width]="item.width"
              [height]="item.height"
              [attr.loading]="$index < 5 ? 'eager' : 'lazy'"
              decoding="async"
            />
          </a>
        }
      </cx-masonry>
    </section>
  </div>
  <figure class="fp-section fp-project-quote" [attr.data-review]="testimonials[0].id">
    <blockquote>“{{ testimonials[0].quote }}”</blockquote>
    <figcaption class="cx-text-muted">{{ gotlandCopy.attribution }}</figcaption>
  </figure>
  <section class="cx-bg-surface-alt" aria-labelledby="gotland-next-title">
    <div class="cx-container fp-section">
      <div class="cx-editorial fp-project-next">
        <h2 id="gotland-next-title" class="fp-heading cx-font-regular">
          {{ commercial.projectBridgeTitle }}
        </h2>
        <p>{{ commercial.projectBridgeBody }}</p>
        <cx-button
          [text]="commercial.poolLink"
          [href]="routeFor('nature-pools')"
          mood="primary"
          size="large"
          appendIcon="arrow-right"
        />
      </div>
    </div>
  </section>
  <fp-gotland-gallery #gallery />
</fp-site-shell>
