<fp-site-shell>
  <cx-hero
    [underMasthead]="true"
    headingClass="cx-font-regular"
    [heading]="copy.home.title"
    variant="cover"
    align="center"
    [fadeBottom]="true"
  >
    <p body>{{ copy.home.ingress }}</p>
    <cx-button
      actions
      [text]="copy.home.primary"
      mood="primary"
      size="large"
      [href]="configureHref"
    />
    <cx-button
      actions
      [text]="copy.home.secondary"
      size="large"
      [href]="routeFor('gotland')"
      appendIcon="arrow-right"
    />
    <p meta>{{ editorial.firstContact }}</p>
    <img
      media
      [src]="images.hero"
      [alt]="editorial.heroAlt"
      width="1536"
      height="1024"
      fetchpriority="high"
    />
  </cx-hero>

  <section class="fp-section" aria-labelledby="home-case-title">
    <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
      <a class="fp-project-link" [href]="routeFor('gotland')" [attr.aria-label]="evidence.caseLink">
        <img
          class="fp-photo"
          [src]="projectPhoto.src"
          [alt]="projectPhoto.alt"
          width="1920"
          height="1440"
          loading="lazy"
        />
      </a>
      <cx-stack gap="xl" align="start">
        <div class="cx-editorial">
          <h2 id="home-case-title" class="cx-font-regular">{{ evidence.caseTitle }}</h2>
        </div>
        <fp-customer-quote [review]="testimonials[1]" />
        <cx-button
          actions
          [text]="evidence.caseLink"
          [href]="routeFor('gotland')"
          appendIcon="arrow-right"
          size="large"
        />
      </cx-stack>
    </cx-grid>
  </section>

  <section class="fp-section" aria-labelledby="home-life-title">
    <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
      <div class="cx-editorial">
        <h2 id="home-life-title" class="cx-font-regular">{{ editorial.lifeTitle }}</h2>
        <p>{{ editorial.lifeBody }}</p>
        <p>
          <a [href]="routeFor('nature-pools')">{{ editorial.lifeLink }} →</a>
        </p>
      </div>
      <img
        class="fp-photo"
        [src]="images.architecture"
        [alt]="editorial.architectureAlt"
        width="1536"
        height="1024"
        loading="lazy"
      />
    </cx-grid>
  </section>

  <div class="fp-band"><fp-package-comparison class="fp-section" /></div>

  <section class="fp-section" aria-labelledby="home-waterscape-title">
    <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
      <img
        class="fp-photo"
        [src]="images.waterscape"
        [alt]="editorial.waterscapeAlt"
        width="1536"
        height="1024"
        loading="lazy"
      />
      <div class="cx-editorial">
        <h2 id="home-waterscape-title" class="cx-font-regular">{{ copy.home.waterscapeTitle }}</h2>
        <p>{{ copy.home.waterscapeBody }}</p>
        <p>
          <a [href]="routeFor('waterscapes')">{{ copy.nav.waterscapes }} →</a>
        </p>
      </div>
    </cx-grid>
  </section>
  <fp-process class="fp-section" />
  <fp-service-area class="fp-section" />
</fp-site-shell>
