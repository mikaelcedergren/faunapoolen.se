<fp-site-shell>
  <cx-hero
    [underMasthead]="false"
    headingClass="cx-font-regular"
    [heading]="copy.guides.title"
    variant="stacked"
  >
    <p body>{{ copy.guides.ingress }}</p>
  </cx-hero>
  @for (group of groups; track group.title) {
    <div class="cx-container fp-section">
      <section [attr.aria-label]="group.title">
        <cx-stack gap="xl">
          <div class="cx-editorial">
            <h2 class="fp-heading cx-font-regular">{{ group.title }}</h2>
          </div>
          <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" gapMobile="xl">
            @for (item of group.articles; track item.id) {
              <a class="fp-article-link" [href]="guideHref(item.id)">
                <cx-stack gap="lg">
                  <img
                    class="fp-article-photo"
                    [src]="item.image"
                    [alt]="item.title"
                    width="1536"
                    height="1024"
                    [attr.loading]="$index < 2 ? 'eager' : 'lazy'"
                  />
                  <cx-stack gap="sm">
                    <h3 class="fp-subheading cx-font-serif cx-font-regular">
                      {{ item.title }}
                    </h3>
                    <p class="cx-text-body-lg cx-text-muted">{{ item.seo.description }}</p>
                    <span class="cx-text-link">{{ copy.guides.read }} →</span>
                  </cx-stack>
                </cx-stack>
              </a>
            }
          </cx-grid>
        </cx-stack>
      </section>
    </div>
  }
  <div class="cx-container fp-section">
    <p class="cx-text-body-lg">
      <a [href]="routeFor('pricing')">{{ pricingLink }} →</a>
    </p>
  </div>
</fp-site-shell>
