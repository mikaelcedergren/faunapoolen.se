<fp-site-shell>
  <div hero class="fp-intro">
    <cx-hero
      [underMasthead]="true"
      headingClass="cx-font-regular"
      [heading]="copy.guides.title"
      variant="stacked"
    >
      <p body>{{ copy.guides.ingress }}</p>
    </cx-hero>
  </div>
  <div class="fp-section">
    <cx-stack gap="2xl">
      <section [attr.aria-label]="copy.guides.title">
        <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" gapMobile="xl">
          @for (item of guides; track item.id) {
            <cx-card variant="border" [href]="guideHref(item.id)" [ariaLabel]="item.title">
              <cx-stack gap="lg">
                <cx-image
                  [image]="{
                    src: item.image,
                    alt: item.title,
                    height: '320',
                    objectFit: 'cover',
                    borderRadius: 'large',
                  }"
                />
                <cx-stack gap="sm">
                  <h2 class="cx-text-title-1 cx-font-serif cx-font-regular">{{ item.title }}</h2>
                  <p class="cx-text-body-lg cx-text-muted">{{ item.seo.description }}</p>
                  <span class="cx-text-link">{{ copy.guides.read }} →</span>
                </cx-stack>
              </cx-stack>
            </cx-card>
          }
        </cx-grid>
      </section>
    </cx-stack>
  </div></fp-site-shell
>
