<fp-site-shell leadFocused [showInvitation]="false" [enquiryTarget]="poolEnquiryHref">
  <cx-hero
    [heading]="copy.naturePools.title"
    headingClass="cx-font-regular"
    variant="cover"
    align="start"
    [underMasthead]="true"
    [parallax]="true"
    [overlayOpacity]="25"
    [fadeBottom]="true"
  >
    <p body>{{ copy.naturePools.ingress }}</p>
    <cx-stack actions gap="sm" align="start">
      <cx-button
        [text]="poolEnquiry.cta"
        mood="primary"
        size="large"
        [href]="poolEnquiryHref"
        appendIcon="arrow-right"
      />
      <p class="cx-text-body">{{ landing.reassurance }}</p>
    </cx-stack>
    <img
      media
      [src]="images.naturePoolHero"
      [alt]="editorial.naturePoolHeroAlt"
      width="1672"
      height="941"
      fetchpriority="high"
    />
  </cx-hero>
  <fp-nature-pool-benefits [introduction]="landing.benefitsIntro" />
  <fp-gotland-preview leadFocused [enquiryHref]="poolEnquiryHref" />
  <fp-process [steps]="landing.steps" />
  <fp-package-comparison [showPricingLink]="false" enquiryAnchor="consultation" showDetails />
  <section class="cx-container fp-section" aria-labelledby="pool-questions-title">
    <cx-stack gap="xl">
      <h2 id="pool-questions-title" class="fp-heading cx-font-serif cx-font-regular">
        {{ landing.questionsTitle }}
      </h2>
      <cx-list>
        @for (item of questions; track item.id) {
          <cx-list-item
            [itemId]="item.id"
            [attr.id]="
              item.id === 'filtration'
                ? 'aquascape'
                : item.id === 'location'
                  ? 'service-area-title'
                  : null
            "
            class="cx-scroll-target"
            [heading]="item.question"
            [expandable]="true"
          >
            <p class="cx-text-body-lg">{{ item.answer }}</p>
          </cx-list-item>
        }
      </cx-list>
    </cx-stack>
  </section>
  <section
    id="consultation"
    class="cx-container fp-section fp-enquiry cx-scroll-target"
    aria-labelledby="pool-enquiry-title"
  >
    <div class="cx-editorial fp-enquiry-intro">
      <h2 id="pool-enquiry-title" class="fp-heading cx-font-serif cx-font-regular">
        {{ poolEnquiry.heading }}
      </h2>
      <p>{{ poolEnquiry.body }}</p>
      <p>{{ poolEnquiry.followUp }}</p>
    </div>
    <fp-enquiry-form compact />
  </section>
</fp-site-shell>
