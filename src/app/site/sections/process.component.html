<section aria-labelledby="process-title">
  <cx-stack gap="xl">
    <div class="cx-editorial">
      <h2 id="process-title" class="cx-font-regular">{{ copy.home.processTitle }}</h2>
    </div>
    <cx-grid [columns]="3" [columnsMobile]="1" gap="2xl">
      @for (item of process; track item.number) {
        <cx-card>
          <cx-stack gap="md" align="start">
            <span class="cx-text-title-1 cx-text-accent">{{ item.number }}</span>
            <h3 class="cx-text-title-1 cx-font-serif cx-font-regular">
              {{ item.title }}
            </h3>
            <p class="cx-text-body-lg">{{ item.body }}</p>
          </cx-stack>
        </cx-card>
      }
    </cx-grid>
  </cx-stack>
</section>
