<fp-site-shell>
  <cx-hero
    [underMasthead]="true"
    align="center"
    [parallax]="true"
    [overlayOpacity]="45"
    headingClass="cx-font-regular"
    [heading]="copy.guides.title"
    variant="cover"
  >
    <p body>{{ copy.guides.ingress }}</p>
    <img
      media
      src="/assets/images/faunapoolen/editorial/guides-evening-1672.webp"
      srcset="
        /assets/images/faunapoolen/editorial/guides-evening-800.webp   800w,
        /assets/images/faunapoolen/editorial/guides-evening-1200.webp 1200w,
        /assets/images/faunapoolen/editorial/guides-evening-1672.webp 1672w
      "
      sizes="100vw"
      [alt]="heroAlt"
      width="1672"
      height="941"
      fetchpriority="high"
    />
  </cx-hero>
  <fp-certification-strip afterHero />
  @for (group of groups; track group.title) {
    <div class="cx-container fp-section">
      <section [attr.aria-label]="group.title">
        <cx-stack gap="xl">
          <div class="cx-editorial">
            <h2 class="fp-heading cx-font-regular">{{ group.title }}</h2>
          </div>
          <cx-grid [columns]="3" [columnsMobile]="1" gap="lg">
            @for (item of group.articles; track item.id) {
              <fp-guide-card [guide]="item" [href]="guideHref(item.id)" />
            }
          </cx-grid>
        </cx-stack>
      </section>
    </div>
  }
</fp-site-shell>
