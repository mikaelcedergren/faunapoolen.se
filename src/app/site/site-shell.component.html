<div class="cx-page">
  <cx-masthead
    heading="Faunapoolen"
    [logoSrc]="logo"
    [homeHref]="homeHref"
    [items]="navItems"
    [menuAriaLabel]="copy.menuLabel"
    [frostOnScroll]="true"
    [overlay]="page !== 'guide'"
  >
    <cx-language-selector
      actions
      [languages]="languageOptions"
      [value]="locale"
      [translations]="{ ariaLabel: languageLabel }"
      (valueChange)="changeLanguage($event)"
    />
  </cx-masthead>
  <main>
    <ng-content select="cx-hero, [hero]" />
    @if (suggestion(); as language) {
      <div class="cx-container cx-pt-2xl">
        <cx-alert
          [heading]="suggestionHeading"
          [action]="language"
          [dismissible]="true"
          (dismiss)="dismissSuggestion()"
        />
      </div>
    }
    <ng-content />
    @if (page !== 'configure' && page !== 'cookies') {
      <section class="cx-container cx-py-2xl" aria-labelledby="contact-invitation-title">
        <cx-card>
          <cx-grid [columns]="2" [columnsMobile]="1" gap="2xl" [align]="'center'">
            <div class="cx-editorial">
              <h2 id="contact-invitation-title" class="cx-font-regular">
                {{ copy.common.talkTitle }}
              </h2>
              <p>{{ priceInvitation }}</p>
            </div>
            <cx-stack align="start">
              <cx-button
                [text]="pricesLabel"
                mood="primary"
                size="large"
                [href]="routeFor('pricing')"
                appendIcon="arrow-right"
              />
            </cx-stack>
          </cx-grid>
        </cx-card>
      </section>
    }
  </main>
  <cx-divider />
  <footer class="cx-bg-surface-alt" [attr.aria-label]="ui.footer">
    <div class="cx-container cx-py-2xl">
      <cx-grid [columns]="3" [columnsMobile]="1" gap="2xl">
        <cx-stack gap="lg" align="start">
          <a [href]="homeHref" aria-label="Faunapoolen">
            <cx-image
              [image]="{
                src: logo,
                alt: '',
                width: '80',
                height: '80',
                objectFit: 'contain',
                borderRadius: 'default',
              }"
            />
          </a>
        </cx-stack>
        <nav [attr.aria-label]="copy.menuLabel">
          <cx-stack gap="md" align="start">
            @for (item of navItems; track item.id) {
              <a [href]="item.href" [attr.aria-current]="item.active ? 'page' : null">{{
                item.label
              }}</a>
            }
          </cx-stack>
        </nav>
        <cx-stack gap="lg" align="start">
          <a href="mailto:info@faunapoolen.se">info&#64;faunapoolen.se</a>
          @if (measurement.available()) {
            <fp-cookie-notice [detailsHref]="routeFor('cookies')" />
          }
          <cx-language-selector
            [languages]="languageOptions"
            [value]="locale"
            [translations]="{ ariaLabel: languageLabel }"
            (valueChange)="changeLanguage($event)"
          />
        </cx-stack>
      </cx-grid>
    </div>
  </footer>
</div>
